<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Página no encontrada | Jhoan Cevallos</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#060b19">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23060b19'/%3E%3Ctext x='32' y='43' font-family='monospace' font-size='30' font-weight='700' fill='%2300f0ff' text-anchor='middle'%3EJC%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;800&display=swap">
    <style>
        :root {
            --bg-base: #060b19;
            --blue-primary: #00f0ff;
            --blue-secondary: #38bdf8;
            --text-muted: #9aa8bd;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            text-align: center;
            background-color: var(--bg-base);
            background-image: radial-gradient(900px 600px at 80% -10%, #0d1b3e 0%, transparent 60%);
            color: #e2e8f0;
            font-family: 'Inter', system-ui, sans-serif;
            line-height: 1.7;
        }
        .code {
            font-family: 'Fira Code', monospace;
            font-size: clamp(4.5rem, 18vw, 8rem);
            font-weight: 800;
            line-height: 1;
            margin: 0;
            background: linear-gradient(92deg, #fff 20%, var(--blue-primary));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        @supports not ((background-clip: text) or (-webkit-background-clip: text)) {
            .code { background: none; color: #fff; }
        }
        h1 { font-size: clamp(1.1rem, 4vw, 1.5rem); margin: 18px 0 8px; font-weight: 600; }
        p { color: var(--text-muted); margin: 0 auto; max-width: 46ch; }
        a.btn {
            display: inline-block;
            margin-top: 30px;
            background: var(--blue-secondary);
            color: var(--bg-base);
            text-decoration: none;
            font-weight: 600;
            padding: 11px 24px;
            border-radius: 8px;
            transition: background .2s, box-shadow .2s;
        }
        a.btn:hover { background: var(--blue-primary); box-shadow: 0 0 22px rgba(0,240,255,.35); }
        a.btn:focus-visible { outline: 2px solid #7dd3fc; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <p class="code">404</p>
        <h1>Esta ruta no existe</h1>
        <p>El recurso que buscas se movió o nunca estuvo aquí. Volvamos al inicio.</p>
        <a class="btn" href="/">Ir al portafolio</a>
    </main>
</body>
</html>
